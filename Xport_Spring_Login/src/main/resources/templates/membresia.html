<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Registro Membresía')}"></head>
<body>

    <div class="dashboard-container">
        <aside th:replace="~{layout :: sidebar('membresia')}"></aside>

        <main>
            <div class="panel">

                <!-- Título -->
                <div class="titulo-modulo">
                    <i class="fa-solid fa-id-card"></i>
                    <h1>Registro Membresía</h1>
                </div>

                <!-- Mensaje de éxito (si se guardó) -->
                <div th:if="${mensaje}" class="alerta-exito">
                    <i class="fa-solid fa-circle-check"></i>
                    <span th:text="${mensaje}">Membresía guardada</span>
                </div>

                <div class="contenido-form">

                    <!-- ============ COLUMNA IZQUIERDA: FORMULARIO ============ -->
                    <form class="form-membresia" 
                          th:action="@{/membresia/guardar}" 
                          th:object="${membresia}" 
                          method="post">

                        <!-- Fila 1: Nro Registro + Condición -->
                        <div class="fila">
                            <div class="campo">
                                <label><i class="fa-solid fa-hashtag"></i> Nro. Registro</label>
                                <input type="text" th:field="*{nroRegistro}" 
                                       placeholder="00000116" readonly>
                            </div>

                            <div class="campo">
                                <label><i class="fa-solid fa-circle-check"></i> Condición</label>
                                <select th:field="*{condicion}">
                                    <option value="ACTIVA">🟢 ACTIVA</option>
                                    <option value="INACTIVA">🔴 INACTIVA</option>
                                </select>
                            </div>
                        </div>

                        <!-- Sección: Datos del Alumno -->
                        <div class="seccion-titulo">
                            <i class="fa-solid fa-user"></i> Datos del Alumno
                        </div>

                        <!-- Fila 2: Código + Buscar + Teléfono -->
                        <div class="fila fila-codigo">
                            <div class="campo">
                                <label><i class="fa-solid fa-barcode"></i> Código</label>
                                <input type="text" th:field="*{codigo}" 
                                       placeholder="70012717">
                            </div>

                            <button type="button" class="btn-buscar">
                                <i class="fa-solid fa-magnifying-glass"></i> Buscar F6
                            </button>

                            <div class="campo">
                                <label><i class="fa-solid fa-phone"></i> Teléfono</label>
                                <input type="tel" th:field="*{telefono}" 
                                       placeholder="987654321">
                            </div>
                        </div>

                        <!-- Fila 3: Nombre -->
                        <div class="campo campo-full">
                            <label><i class="fa-solid fa-user"></i> Nombre</label>
                            <input type="text" th:field="*{nombre}" 
                                   placeholder="ALEJANDRO INGOL (HIJO) Y ALEJANDRO INGOL (PAPÁ)">
                        </div>

                        <!-- Fila 4: Dirección -->
                        <div class="campo campo-full">
                            <label><i class="fa-solid fa-location-dot"></i> Dirección</label>
                            <input type="text" th:field="*{direccion}" 
                                   placeholder="Av. Próceres de la independencia 1234, Lima">
                        </div>

                        <!-- Fila 5: Fechas -->
                        <div class="fila">
                            <div class="campo">
                                <label><i class="fa-solid fa-calendar"></i> Fecha Nacimiento</label>
                                <input type="date" th:field="*{fechaNacimiento}">
                            </div>

                            <div class="campo">
                                <label><i class="fa-solid fa-calendar-check"></i> Fecha Vencimiento</label>
                                <input type="date" th:field="*{fechaVencimiento}">
                            </div>
                        </div>

                        <!-- Fila 6: Responsable -->
                        <div class="campo campo-full">
                            <label><i class="fa-solid fa-user-tie"></i> Responsable</label>
                            <select th:field="*{responsable}">
                                <option value="1 - ADMIN">1 - ADMIN</option>
                                <option value="2 - RECEPCION">2 - RECEPCION</option>
                            </select>
                        </div>

                        <!-- Fila 7: Periodos + Días + Tarifa -->
                        <div class="fila fila-tres">
                            <div class="campo">
                                <label><i class="fa-solid fa-clock"></i> Periodos</label>
                                <select th:field="*{periodos}">
                                    <option value="MENSUAL">MENSUAL</option>
                                    <option value="TRIMESTRAL">TRIMESTRAL</option>
                                    <option value="ANUAL">ANUAL</option>
                                </select>
                            </div>

                            <div class="campo">
                                <label><i class="fa-solid fa-calendar-days"></i> Días límite</label>
                                <input type="number" th:field="*{diasLimite}" value="30">
                            </div>

                            <div class="campo">
                                <label><i class="fa-solid fa-dollar-sign"></i> Tarifa</label>
                                <input type="number" step="0.01" th:field="*{tarifa}" value="100.00">
                            </div>
                        </div>

                        <!-- Fila 8: Duración + Frecuencia -->
                        <div class="fila">
                            <div class="campo">
                                <label><i class="fa-solid fa-hourglass"></i> Duración</label>
                                <input type="text" th:field="*{duracion}" 
                                       value="0 días, 0 semanas, 1 mes, 0 años">
                            </div>

                            <div class="campo">
                                <label><i class="fa-solid fa-repeat"></i> Frecuencia</label>
                                <select th:field="*{frecuencia}">
                                    <option value="DIARIO">DIARIO</option>
                                    <option value="SEMANAL">SEMANAL</option>
                                    <option value="MENSUAL">MENSUAL</option>
                                </select>
                            </div>
                        </div>

                        <!-- Fila 9: Observación -->
                        <div class="campo campo-full">
                            <label><i class="fa-solid fa-comment"></i> Observación</label>
                            <textarea th:field="*{observacion}" rows="3"
                                      placeholder="Membresía Mensual - Plan estándar"></textarea>
                        </div>

                        <!-- Fila 10: Condición Deuda -->
                        <div class="campo campo-full">
                            <label><i class="fa-solid fa-money-bill"></i> Condición Deuda</label>
                            <input type="text" th:field="*{condicionDeuda}" 
                                   placeholder="PAGADO">
                        </div>

                        <!-- Botones -->
                        <div class="botones-form">
                            <button type="reset" class="btn-form btn-nuevo">
                                <i class="fa-solid fa-plus"></i> Nuevo (F2)
                            </button>
                            <button type="submit" class="btn-form btn-pago">
                                <i class="fa-solid fa-money-bill-transfer"></i> Reportar Pago (F3)
                            </button>
                            <button type="button" class="btn-form btn-actualizar">
                                <i class="fa-solid fa-rotate"></i> Actualizar (F4)
                            </button>
                            <button type="button" class="btn-form btn-salir">
                                <i class="fa-solid fa-right-from-bracket"></i> Salir (Esc)
                            </button>
                        </div>

                    </form>

                    <!-- ============ COLUMNA DERECHA: ASISTENCIAS ============ -->
                    <aside class="asistencias-card">
                        <div class="asistencias-titulo">
                            <i class="fa-solid fa-calendar-check"></i>
                            <span>ASISTENCIAS</span>
                        </div>

                        <table class="tabla-asistencias">
                            <thead>
                                <tr>
                                    <th>Día</th>
                                    <th>Horario Ingreso</th>
                                    <th>Fecha Ingreso</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr><td>1</td><td>08:10:00</td><td>01/08/2026</td></tr>
                                <tr><td>2</td><td>08:00:00</td><td>03/09/2026</td></tr>
                                <tr><td>3</td><td>08:10:00</td><td>05/09/2026</td></tr>
                                <tr><td>4</td><td>08:10:00</td><td>08/09/2026</td></tr>
                                <tr><td>5</td><td>08:14:00</td><td>10/09/2026</td></tr>
                                <tr><td>6</td><td>08:10:00</td><td>12/09/2026</td></tr>
                                <tr><td>7</td><td>08:10:00</td><td>15/09/2026</td></tr>
                                <tr><td>8</td><td>08:12:00</td><td>18/09/2026</td></tr>
                            </tbody>
                        </table>
                    </aside>

                </div>
            </div>
        </main>
    </div>

</body>
</html>
